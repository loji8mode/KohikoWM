########################################
# Kohiko Configuration
########################################

general.border_size=2
general.inner_gap=6
general.outer_gap=6
general.bar_height=26
general.focus_follows_mouse=true
general.smart_gaps=true
general.smart_borders=true

########################################
# Applications
########################################

exec.terminal=xterm
exec.launcher=jgmenu_run
exec.browser=firefox

########################################
# Mouse
########################################

mouse.swap=SUPER+BTN1
mouse.resize=SUPER+BTN3

########################################
# Scratchpad
########################################

scratchpad.width=70%
scratchpad.height=70%
scratchpad.center=true

########################################
# Workspaces
########################################

workspace.count=10

########################################
# Keybinds
########################################

bind=SUPER+RETURN exec terminal
bind=SUPER+D exec launcher

bind=SUPER+Q close

bind=SUPER+SPACE toggle_floating

bind=SUPER+F fullscreen

bind=SUPER+F1 scratchpad_toggle

bind=SUPER+1 workspace 1
bind=SUPER+2 workspace 2
bind=SUPER+3 workspace 3
bind=SUPER+4 workspace 4
bind=SUPER+5 workspace 5
bind=SUPER+6 workspace 6
bind=SUPER+7 workspace 7
bind=SUPER+8 workspace 8
bind=SUPER+9 workspace 9
bind=SUPER+0 workspace 10